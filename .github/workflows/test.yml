name: Test Workflow
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            engine
            go.mod
            go.sum
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Go Tidy
        run: go mod tidy
      - name: Run tests
        run: go test -v ./... 